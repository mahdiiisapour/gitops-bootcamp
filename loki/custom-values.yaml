# ============================================================================
# COMPLETE LOKI CONFIGURATION - FOR DISTRIBUTED/STATEFULSET DEPLOYMENT
# ============================================================================
# This matches your current setup (loki-0 StatefulSet)
# File: loki-values.yaml

# Deployment mode - use distributed for StatefulSet
deploymentMode: Distributed

loki:
  auth_enabled: false
  
  # Common configuration
  commonConfig:
    replication_factor: 1
  
  # Storage configuration - filesystem for single node
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  
  # Schema configuration
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  
  # Server configuration
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    log_level: info
  
  # Ingester configuration
  ingester:
    wal:
      enabled: true
      dir: /var/loki/wal
      flush_on_shutdown: true
    lifecycler:
      ring:
        replication_factor: 1
        kvstore:
          store: inmemory
      final_sleep: 0s
    chunk_idle_period: 5m
    chunk_retain_period: 30s
    max_chunk_age: 2h
  
  # Limits configuration - IMPORTANT for label support
  limits_config:
    retention_period: 720h  # 30 days
    allow_structured_metadata: true
    
    # Stream limits - 0 = unlimited
    max_streams_per_user: 0
    max_global_streams_per_user: 0
    
    # Query limits
    max_chunks_per_query: 2000000
    max_query_length: 721h
    max_query_parallelism: 32
    max_entries_limit_per_query: 10000
    query_timeout: 5m
    
    # Sample limits
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    
    # Rate limits
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40
    per_stream_rate_limit: 10MB
    per_stream_rate_limit_burst: 20MB
    
    # Label limits - IMPORTANT for namespace/container filtering
    max_label_name_length: 1024
    max_label_value_length: 2048
    max_label_names_per_series: 30
    
    # Query splitting
    split_queries_by_interval: 30m
    
    # Cardinality limits
    cardinality_limit: 100000
    max_query_series: 10000
    
    # Volume stats
    volume_enabled: true
  
  # Querier configuration
  querier:
    max_concurrent: 20
  
  # Query scheduler
  query_scheduler:
    max_outstanding_requests_per_tenant: 2048
  
  # Query frontend
  frontend:
    max_outstanding_per_tenant: 2048
    compress_responses: true
    log_queries_longer_than: 10s
  
  # Compactor
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    compaction_interval: 10m
    delete_request_store: filesystem
  
  # Distributor
  distributor:
    ring:
      kvstore:
        store: inmemory
  
  # Storage config for better performance
  storage_config:
    tsdb_shipper:
      active_index_directory: /var/loki/tsdb-index
      cache_location: /var/loki/tsdb-cache
      index_gateway_client:
        server_address: ""
    filesystem:
      directory: /var/loki/chunks

# Write component (for distributed mode)
write:
  replicas: 1
  persistence:
    enabled: true
    storageClass: hcloud-volumes
    size: 20Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# Read component (for distributed mode)
read:
  replicas: 1
  persistence:
    enabled: true
    storageClass: hcloud-volumes
    size: 10Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

# Backend component (for distributed mode)
backend:
  replicas: 1
  persistence:
    enabled: true
    storageClass: hcloud-volumes
    size: 10Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

# Gateway configuration
gateway:
  enabled: true
  replicas: 1
  
  service:
    type: ClusterIP
    port: 80
  
  ingress:
    enabled: false
  
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# Disable single binary (you're using distributed)
singleBinary:
  replicas: 0

# Monitoring configuration
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  
  serviceMonitor:
    enabled: false
  
  lokiCanary:
    enabled: true  # Keep this for testing

# Ruler
ruler:
  enabled: false

# Caching
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Memcached
memcached:
  enabled: false

# Test
test:
  enabled: false