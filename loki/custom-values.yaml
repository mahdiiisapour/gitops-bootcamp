deploymentMode: SingleBinary

loki:
  auth_enabled: false
  storage:
    bucketNames:
      chunks: chunks
      ruler: ruler
  containerSecurityContext:
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
    allowPrivilegeEscalation: false
  
  # Schema configuration for proper label handling
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  
  server:
    http_listen_port: 3100
    log_level: info
  
  ingester:
    wal:
      enabled: false
    max_chunk_age: 2h
  
  limits_config:
    retention_period: 720h
    allow_structured_metadata: true
    max_streams_per_user: 10000
  
  # Query config for better performance
  querier:
    max_concurrent: 20

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: hcloud-volumes
    size: 10Gi
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

gateway:
  enabled: true
  replicas: 1

write:
  replicas: 0

read:
  replicas: 0

backend:
  replicas: 0

memcached:
  enabled: false

resultsCache:
  enabled: false

chunksCache:
  enabled: false
