deploymentMode: SingleBinary

loki:
  auth_enabled: false
  
  # CRITICAL: Set replication_factor to 1 for single instance
  commonConfig:
    replication_factor: 1
  
  # Storage configuration
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  
  # Schema configuration
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  
  # Server configuration
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    log_level: info
  
  # Ingester configuration
  ingester:
    wal:
      enabled: true
      dir: /var/loki/wal
      flush_on_shutdown: true
    lifecycler:
      ring:
        replication_factor: 1
        kvstore:
          store: inmemory
      final_sleep: 0s
    chunk_idle_period: 5m
    chunk_retain_period: 30s
    max_chunk_age: 2h
  
  # Limits configuration
  limits_config:
    retention_period: 720h
    allow_structured_metadata: true
    max_streams_per_user: 10000
    max_global_streams_per_user: 10000
    max_chunks_per_query: 2000000
    max_query_length: 721h
    max_query_parallelism: 32
    max_entries_limit_per_query: 10000
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 15MB
  
  # Querier configuration
  querier:
    max_concurrent: 20
  
  # Query scheduler
  query_scheduler:
    max_outstanding_requests_per_tenant: 2048
  
  # Frontend
  frontend:
    max_outstanding_per_tenant: 2048
  
  # Compactor - FIXED: removed invalid shared_store field
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    compaction_interval: 10m
  
  # Distributor
  distributor:
    ring:
      kvstore:
        store: inmemory

# Single binary deployment
singleBinary:
  replicas: 1
  
  persistence:
    enabled: true
    storageClass: hcloud-volumes
    size: 20Gi
  
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  
  extraArgs:
    - -config.expand-env=true

# Gateway configuration - FIXED: removed duplicate client_max_body_size
gateway:
  enabled: true
  replicas: 1
  
  service:
    type: ClusterIP
    port: 80
  
  ingress:
    enabled: false
  
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  
  # Simplified nginx config - only in ONE place
  nginxConfig:
    httpSnippet: |-
      client_max_body_size 10M;

# Disable distributed components
write:
  replicas: 0

read:
  replicas: 0

backend:
  replicas: 0

# Disable monitoring
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  
  serviceMonitor:
    enabled: false
  
  lokiCanary:
    enabled: false

# Disable ruler (not needed for basic setup)
ruler:
  enabled: false

# Disable caching
chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Disable memcached
memcached:
  enabled: false

# Disable test
test:
  enabled: false