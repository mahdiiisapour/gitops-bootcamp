# ============================================================================
# LOKI CONFIGURATION - SINGLEBINARY MODE (NO OBJECT STORAGE)
# ============================================================================
# This completely disables distributed components
# File: loki-values.yaml

# MUST be SingleBinary for filesystem storage
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  
  # Single instance configuration
  commonConfig:
    replication_factor: 1
  
  # Filesystem storage (no S3/GCS/etc)
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  
  # Schema configuration
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  
  # Server configuration
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    log_level: info
  
  # Ingester configuration
  ingester:
    wal:
      enabled: true
      dir: /var/loki/wal
      flush_on_shutdown: true
    lifecycler:
      ring:
        replication_factor: 1
        kvstore:
          store: inmemory
      final_sleep: 0s
    chunk_idle_period: 5m
    chunk_retain_period: 30s
    max_chunk_age: 2h
  
  # Limits configuration
  limits_config:
    retention_period: 720h
    allow_structured_metadata: true
    max_streams_per_user: 0
    max_global_streams_per_user: 0
    max_chunks_per_query: 2000000
    max_query_length: 721h
    max_query_parallelism: 32
    max_entries_limit_per_query: 10000
    query_timeout: 5m
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40
    per_stream_rate_limit: 10MB
    per_stream_rate_limit_burst: 20MB
    max_label_name_length: 1024
    max_label_value_length: 2048
    max_label_names_per_series: 30
    split_queries_by_interval: 30m
    cardinality_limit: 100000
    max_query_series: 10000
    volume_enabled: true
  
  # Querier configuration
  querier:
    max_concurrent: 20
  
  # Frontend configuration
  frontend:
    max_outstanding_per_tenant: 2048
    compress_responses: true
    log_queries_longer_than: 10s
  
  # Compactor
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    compaction_interval: 10m
  
  # Storage config
  storage_config:
    filesystem:
      directory: /var/loki/chunks

# CRITICAL: Single binary deployment only
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: hcloud-volumes
    size: 20Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# Gateway (nginx reverse proxy)
gateway:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# CRITICAL: Disable ALL distributed components
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# Disable monitoring components
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: false
  lokiCanary:
    enabled: false

# Disable other components
ruler:
  enabled: false
indexGateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
memcached:
  enabled: false
memcachedExporter:
  enabled: false

# Disable test
test:
  enabled: false