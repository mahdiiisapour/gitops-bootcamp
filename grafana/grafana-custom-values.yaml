adminUser: admin
adminPassword: helldiverslab123!

# Datasources configuration
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # Loki datasource for logs
      - name: Loki
        type: loki
        access: proxy
        # FIXED: Use the gateway service (not direct loki service)
        url: http://loki-gateway.observability.svc.cluster.local
        jsonData:
          # Enable all label options
          maxLines: 1000
          timeout: 60
          # Derived fields for trace correlation
          derivedFields:
            - name: TraceID
              matcherRegex: "traceID=(\\w+)"
              url: $${__value.raw}
              datasourceUid: tempo
        isDefault: false
        
      # Optional: Prometheus datasource for metrics
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  labels: {}
  path: /
  pathType: Prefix
  hosts:
    - grafana.helldiverslab.uk
  tls:
    - hosts:
        - grafana.helldiverslab.uk
      secretName: wildcard-helldiverslab-tls
  extraPaths: []