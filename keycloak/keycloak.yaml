# keycloak.yaml
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  instances: 1
  db:
    vendor: postgres
    host: postgres          # matches the Service name above
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true       # set to false and add tlsSecret for HTTPS
  hostname:
    hostname: keycloak.helldiverslab.uk   # your actual hostname
    strict: false
  proxy:
    headers: xforwarded 