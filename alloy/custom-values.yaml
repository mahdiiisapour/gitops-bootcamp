# ============================================================================
# COMPLETE ALLOY CONFIGURATION - FIXED VERSION
# ============================================================================
# This fixes the log path issue: removes double slashes and uses correct pattern
# File: alloy-values.yaml

alloy:
  # ConfigMap configuration
  configMap:
    create: true
    content: |
      // ===============================
      // Kubernetes Pod Log Collection
      // ===============================
      discovery.kubernetes "pods" {
        role = "pod"
      }
      
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        
        // Keep only running pods
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          action        = "keep"
          regex         = "Running"
        }
        
        // Namespace label (CRITICAL for filtering)
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        
        // Pod name
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        
        // Container name
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        
        // Node name
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        
        // App label (if exists)
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
          regex         = "(.+)"
        }
        
        // Job (namespace/container combination)
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }
        
        // FIXED: Direct path construction - builds correct Kubernetes log paths
        // Kubernetes log structure: /var/log/pods/namespace_podname_uid/container/0.log
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/$1_$2_$3/$4/*.log"
        }
      }
      
      // File-based log scraping
      loki.source.file "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }
      
      // Write to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
        
        external_labels = {
          cluster = "production",
        }
      }
  
  # Clustering configuration
  clustering:
    enabled: false
  
  # Stability level
  stabilityLevel: "generally-available"
  
  # Storage path for WAL and other data
  storagePath: /tmp/alloy
  
  # HTTP server configuration
  listenAddr: 0.0.0.0
  listenPort: 12345
  listenScheme: HTTP
  uiPathPrefix: /
  
  # CRITICAL: Enable host log path mounts
  mounts:
    # Mount /var/log from the host
    varlog: true
    # Mount /var/lib/docker/containers from the host (for Docker runtime)
    dockercontainers: true
    # Extra mounts if needed
    extra: []

# Controller settings
controller:
  type: "daemonset"
  # Extra volumes (if varlog/dockercontainers above don't work)
  volumes:
    extra: []

# Service Account
serviceAccount:
  create: true
  name: alloy-sa

# RBAC - needs permissions to discover pods
rbac:
  create: true

# Resources
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# Pod annotations
podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

# Service
service:
  enabled: true
  type: ClusterIP

