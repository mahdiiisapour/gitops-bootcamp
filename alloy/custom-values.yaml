replicaCount: 3

image:
  repository: grafana/alloy
  tag: "v1.0.0"  # Use a specific version for production

serviceAccount:
  create: true
  name: alloy-sa

podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

readinessProbe:
  httpGet:
    path: /ready
    port: 12345
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /-/healthy
    port: 12345
  initialDelaySeconds: 30
  periodSeconds: 20

alloyConfig: |
  // ===== KUBERNETES POD LOG DISCOVERY =====
  discovery.kubernetes "pods" {
    role = "pod"
  }

  // Relabel pod metadata to useful labels
  discovery.relabel "pod_logs" {
    targets = discovery.kubernetes.pods.targets
    
    rule {
      source_labels = ["__meta_kubernetes_namespace"]
      target_label  = "namespace"
    }
    rule {
      source_labels = ["__meta_kubernetes_pod_name"]
      target_label  = "pod"
    }
    rule {
      source_labels = ["__meta_kubernetes_pod_container_name"]
      target_label  = "container"
    }
    rule {
      source_labels = ["__meta_kubernetes_pod_label_app"]
      target_label  = "app"
    }
    rule {
      source_labels = ["__meta_kubernetes_pod_node_name"]
      target_label  = "node"
    }
    rule {
      source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
      separator     = "/"
      target_label  = "job"
    }
  }

  // Process logs and add static labels
  loki.process "pod_logs" {
    forward_to = [loki.write.loki.receiver]

    stage.static_labels {
      values = {
        cluster = "production",
        source  = "kubernetes",
      }
    }
  }

  // Read pod logs from Kubernetes
  loki.source.kubernetes "pods" {
    targets    = discovery.relabel.pod_logs.output
    forward_to = [loki.process.pod_logs.receiver]
  }

  // ===== OTLP RECEIVER CONFIGURATION =====
  otelcol.receiver.otlp "default" {
    grpc {
      endpoint = "0.0.0.0:4317"
    }
    http {
      endpoint = "0.0.0.0:4318"
    }
    
    output {
      metrics = [otelcol.processor.batch.default.input]
      logs    = [otelcol.processor.batch.default.input]
      traces  = [otelcol.processor.batch.default.input]
    }
  }

  // Batch processor for performance
  otelcol.processor.batch "default" {
    send_batch_size = 1024
    timeout         = "10s"
    
    output {
      metrics = [otelcol.exporter.prometheusremotewrite.mimir.input]
      logs    = [otelcol.exporter.otlphttp.loki.input]
      traces  = [otelcol.exporter.logging.traces.input]
    }
  }

  // ===== EXPORTERS =====
  // Export logs to Loki via OTLP HTTP
  otelcol.exporter.otlphttp "loki" {
    client {
      endpoint = "http://loki-gateway.observability.svc.cluster.local/otlp"
      tls {
        insecure = true
      }
    }
  }

  // Export metrics to Mimir
  otelcol.exporter.prometheusremotewrite "mimir" {
    endpoint {
      url = "http://mimir-distributor.observability.svc.cluster.local:9009/api/v1/push"
    }
  }

  // Export traces to stdout (replace with Tempo when available)
  otelcol.exporter.logging "traces" {
    verbosity           = "detailed"
    sampling_initial    = 5
    sampling_thereafter = 200
  }

  // ===== LOKI WRITER (for Kubernetes pod logs) =====
  loki.write "loki" {
    endpoint {
      url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
    }
    
    external_labels = {
      cluster = "production",
    }
  }

# Service exposure
service:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: http-metrics
      port: 12345
      targetPort: 12345
      protocol: TCP

# RBAC for Kubernetes discovery
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "nodes", "services", "endpoints"]
      verbs: ["get", "list", "watch"]

nodeSelector: {}
tolerations: []
affinity: {}

logLevel: info