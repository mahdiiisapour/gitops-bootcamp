alloy:
  # Clustering configuration
  clustering:
    enabled: false
  
  # Stability level
  stabilityLevel: "generally-available"

# Controller settings
controller:
  type: "daemonset"
  
# Service Account
serviceAccount:
  create: true
  name: alloy-sa

# RBAC
rbac:
  create: true

# Resources
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# Pod annotations
podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

# Service
service:
  enabled: true
  type: ClusterIP

# Volumes for log collection
extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

extraVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true

# THE CRITICAL PART - Configuration in the correct format
configMap:
  create: true
  content: |
    // ===============================
    // Kubernetes Pod Log Collection
    // ===============================
    discovery.kubernetes "pods" {
      role = "pod"
    }
    
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets
      
      // Keep only running pods
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        action        = "keep"
        regex         = "Running"
      }
      
      // Namespace label (CRITICAL for filtering)
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
        action        = "replace"
      }
      
      // Pod name
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
        action        = "replace"
      }
      
      // Container name
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
        action        = "replace"
      }
      
      // Node name
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
        action        = "replace"
      }
      
      // App label (if exists)
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
        action        = "replace"
        regex         = "(.+)"
      }
      
      // Job (namespace/container combination)
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "job"
        action        = "replace"
      }
      
      // Log file path
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/$2/*.log"
        action        = "replace"
      }
    }
    
    // File-based log scraping
    loki.source.file "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.write.default.receiver]
    }
    
    // Write to Loki
    loki.write "default" {
      endpoint {
        url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
      }
      
      external_labels = {
        cluster = "production"
      }
    }