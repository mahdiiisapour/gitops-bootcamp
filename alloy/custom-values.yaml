replicaCount: 1
image:
  repository: grafana/alloy
  tag: "v1.0.0"
serviceAccount:
  create: true
  name: alloy-sa
podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"
alloyConfig: |
  // Discover all pods in the cluster
  discovery.kubernetes "pods" {
    role = "pod"
  }
  
  // Relabel to add metadata as labels
  discovery.relabel "pod_logs" {
    targets = discovery.kubernetes.pods.targets
    
    // Keep only running pods
    rule {
      source_labels = ["__meta_kubernetes_pod_phase"]
      action        = "keep"
      regex         = "Running"
    }
    
    // Namespace
    rule {
      source_labels = ["__meta_kubernetes_namespace"]
      target_label  = "namespace"
    }
    
    // Pod
    rule {
      source_labels = ["__meta_kubernetes_pod_name"]
      target_label  = "pod"
    }
    
    // Container
    rule {
      source_labels = ["__meta_kubernetes_pod_container_name"]
      target_label  = "container"
    }
    
    // Node
    rule {
      source_labels = ["__meta_kubernetes_pod_node_name"]
      target_label  = "node"
    }
    
    // App label
    rule {
      source_labels = ["__meta_kubernetes_pod_label_app"]
      target_label  = "app"
    }
    
    // Job
    rule {
      source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
      separator     = "/"
      target_label  = "job"
    }
    
    // Ensure __path__ is set correctly
    rule {
      source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
      separator     = "/"
      target_label  = "__path__"
      replacement   = "/var/log/pods/*$1/*.log"
    }
  }
  
  // Read logs from discovered pods
  loki.source.kubernetes "pod_logs" {
    targets    = discovery.relabel.pod_logs.output
    forward_to = [loki.process.add_labels.receiver]
  }
  
  // Process logs to ensure labels are preserved
  loki.process "add_labels" {
    forward_to = [loki.write.default.receiver]
    
    // Stage to keep all labels from discovery
    stage.labels {
      values = {
        namespace = "",
        pod       = "",
        container = "",
        node      = "",
        app       = "",
        job       = "",
      }
    }
  }
  
  // Write to Loki
  loki.write "default" {
    endpoint {
      url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
    }
    
    external_labels = {
      cluster = "production",
    }
  }

service:
  enabled: true
  type: ClusterIP

# CRITICAL: Run as DaemonSet to access node logs
controller:
  type: "daemonset"

# RBAC permissions
rbac:
  create: true

# Mount host log directories
extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

extraVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true

