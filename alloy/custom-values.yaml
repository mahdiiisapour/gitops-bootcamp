# Alloy Custom Values Configuration - FIXED VERSION
# Complete configuration file for Grafana Alloy Helm chart

alloy:
  # ConfigMap configuration
  configMap:
    create: true
    content: |
      // ===============================
      // Kubernetes Pod Log Collection
      // ===============================
      discovery.kubernetes "pods" {
        role = "pod"
      }
      
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        
        // Keep only running pods
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          action        = "keep"
          regex         = "Running"
        }
        
        // Namespace label (CRITICAL for filtering)
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        
        // Pod name
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        
        // Container name
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        
        // Node name
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        
        // App label (if exists)
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
          regex         = "(.+)"
        }
        
        // Job (namespace/container combination)
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }
        
        // FIXED: Correct log file path pattern for Kubernetes
        // K8s path format: /var/log/pods/<namespace>_<pod-name>_<uid>/<container>/*.log
        rule {
          action       = "replace"
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator    = "/"
          regex        = "([^/]+)/([^/]+)/([^/]+)/([^/]+)"
          replacement  = "/var/log/pods/$1_$2_$3/$4/*.log"
          target_label = "__path__"
        }
      }
      
      // File-based log scraping
      loki.source.file "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }
      
      // Write to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
        
        external_labels = {
          cluster = "production",
        }
      }
  
  # Clustering configuration
  clustering:
    enabled: false
  
  # Stability level
  stabilityLevel: "generally-available"
  
  # Storage path for WAL and other data
  storagePath: /tmp/alloy
  
  # HTTP server configuration
  listenAddr: 0.0.0.0
  listenPort: 12345
  listenScheme: HTTP
  uiPathPrefix: /
  
  # CRITICAL: Mount host paths for log access
  mounts:
    # Mount /var/log from the host
    varlog: true
    # Mount /var/lib/docker/containers from the host (if using Docker)
    # dockercontainers: true

# Controller settings
controller:
  type: "daemonset"
  # CRITICAL: Allow host path access
  hostPID: false
  hostNetwork: false

# Service Account
serviceAccount:
  create: true
  name: alloy-sa

# RBAC - needs permissions to discover pods
rbac:
  create: true

# Resources
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# Pod annotations
podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

# Service
service:
  enabled: true
  type: ClusterIP

# CRITICAL FIX: Proper volume configuration for Alloy Helm Chart
# The chart uses 'alloy.mounts.varlog' instead of 'extraVolumes'
# But if that doesn't work, we need to use the chart's native mounting

