# alloy-values.yaml - customize values below
replicaCount: 3

image:
  # pin a stable alloy image if you want (optional)
  repository: grafana/alloy
  tag: "latest" # replace with a specific image tag for production

serviceAccount:
  create: true
  name: alloy-sa

podAnnotations:
  # optional: annotation for APM
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# Liveness / readiness probes (tweak if needed)
readinessProbe:
  httpGet:
    path: /ready
    port: 13133
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /live
    port: 13133
  initialDelaySeconds: 30
  periodSeconds: 20

# Alloy configuration (OpenTelemetry Collector + Alloy components)
# This config receives OTLP from applications and exports:
# - Logs -> Loki (OTLP/HTTP)
# - Metrics -> Mimir (Prometheus remote_write)
# - Traces -> logging (change to tempo if available)
alloyConfig: |
  // Discover Kubernetes pod logs
  discovery.kubernetes "pods" {
    role = "pod"
  }

  // Kubernetes relabel to add labels
  discovery.relabel "pod_logs" {
    targets = discovery.kubernetes.pods.targets
    
    rule {
      source_labels = ["__meta_kubernetes_namespace_name"]
      target_label = "namespace"
    }
    rule {
      source_labels = ["__meta_kubernetes_pod_name"]
      target_label = "pod"
    }
    rule {
      source_labels = ["__meta_kubernetes_pod_container_name"]
      target_label = "container"
    }
  }

  // Read pod logs from Kubernetes
  loki.source.kubernetes "pods" {
    targets    = discovery.relabel.pod_logs.output
    forward_to = [loki.process.logs.receiver]
  }

  // Process logs: parse JSON if possible
  loki.process "logs" {
    stage.json {
      expressions = {
        output = "",
      }
    }
    forward_to = [loki.write.loki.receiver]
  }

  // Send logs to Loki
  loki.write "loki" {
    endpoint {
      url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
    }
  }

  // Receive OTLP logs from applications
  otelcol.receiver.otlp "default" {
    grpc {
      endpoint = "0.0.0.0:4317"
    }
    http {
      endpoint = "0.0.0.0:4318"
    }
  }

  // Batch processor for better performance
  otelcol.processor.batch "default" {
    send_batch_size    = 1024
    timeout            = "10s"
  }

  // Export logs to Loki via OTLP
  otelcol.exporter.otlphttp "loki" {
    client {
      endpoint = "http://loki.observability.svc.cluster.local:3100/v1/logs"
      headers = {
        "Authorization" = "Bearer ${LOKI_TOKEN}",
      }
    }
  }

  // Export metrics to Mimir via Prometheus remote_write
  otelcol.exporter.prometheusremotewrite "mimir" {
    endpoint = "http://mimir-distributor.observability.svc.cluster.local:9009/api/v1/push"
    headers = {
      "Authorization" = "Bearer ${MIMIR_TOKEN}",
    }
    resource_to_telemetry_conversion {
      enabled = true
    }
  }

  // Export traces to stdout for logging (or configure Tempo if available)
  otelcol.exporter.logging "traces" {
    loglevel = "info"
  }

  // Pipelines: route telemetry to exporters
  otelcol.pipeline.logs "default" {
    receivers  = ["otelcol.receiver.otlp.default"]
    processors = ["otelcol.processor.batch.default"]
    exporters  = ["otelcol.exporter.otlphttp.loki"]
  }

  otelcol.pipeline.metrics "default" {
    receivers  = ["otelcol.receiver.otlp.default"]
    processors = ["otelcol.processor.batch.default"]
    exporters  = ["otelcol.exporter.prometheusremotewrite.mimir"]
  }

  otelcol.pipeline.traces "default" {
    receivers  = ["otelcol.receiver.otlp.default"]
    processors = ["otelcol.processor.batch.default"]
    exporters  = ["otelcol.exporter.logging.traces"]
  }

# Environment variables available in the alloy Pod.
# We map secret values into env here; these are referenced in the alloyConfig using ${VAR}
env:
  - name: LOKI_TOKEN
    valueFrom:
      secretKeyRef:
        name: alloy-remote-credentials
        key: LOKI_TOKEN
  - name: MIMIR_TOKEN
    valueFrom:
      secretKeyRef:
        name: alloy-remote-credentials
        key: MIMIR_TOKEN

# Service exposure
service:
  type: ClusterIP
  port: 4317   # OTLP gRPC
  port_http: 4318 # OTLP HTTP

# Optionally enable Prometheus scraping on alloy itself
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false

# RBAC (if you want to grant Alloy read access to the kube API for Kubernetes discovery)
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "endpoints"]
      verbs: ["get","list","watch"]

# Pod security / tolerations and nodeSelector - tweak for your cluster policies
nodeSelector: {}
tolerations: []
affinity: {}

# Extra volumes (e.g. mount TLS certs) - example shows mounting a secret with CA if you need TLS to Loki/Mimir
extraVolumeMounts: []
extraVolumes: []

# Logging level (debug / info / warn / error)
logLevel: info
