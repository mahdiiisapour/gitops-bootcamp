# alloy-values.yaml - customize values below
replicaCount: 3

image:
  # pin a stable alloy image if you want (optional)
  repository: grafana/alloy
  tag: "latest" # replace with a specific image tag for production

serviceAccount:
  create: true
  name: alloy-sa

podAnnotations:
  # optional: annotation for APM
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# Liveness / readiness probes (tweak if needed)
readinessProbe:
  httpGet:
    path: /ready
    port: 13133
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /live
    port: 13133
  initialDelaySeconds: 30
  periodSeconds: 20

# Alloy configuration (OpenTelemetry Collector + Alloy components)
# This config receives OTLP from applications and exports:
# - Logs -> Loki (OTLP/HTTP)
# - Metrics -> Mimir (Prometheus remote_write)
# - Traces -> logging (change to tempo if available)
alloyConfig: |
  // ===== KUBERNETES POD LOG DISCOVERY =====
  discovery.kubernetes "pods" {
    role = "pod"
  }

  // Relabel pod metadata to useful labels
  discovery.relabel "pod_logs" {
    targets = discovery.kubernetes.pods.targets
    
    rule {
      source_labels = ["__meta_kubernetes_namespace"]
      target_label  = "namespace"
    }
    rule {
      source_labels = ["__meta_kubernetes_pod_name"]
      target_label  = "pod"
    }
    rule {
      source_labels = ["__meta_kubernetes_pod_container_name"]
      target_label  = "container"
    }
    rule {
      source_labels = ["__meta_kubernetes_pod_label_app"]
      target_label  = "app"
    }
    rule {
      source_labels = ["__meta_kubernetes_pod_node_name"]
      target_label  = "node"
    }
    rule {
      source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
      separator     = "/"
      target_label  = "job"
    }
  }

  // Process logs and add static labels
  loki.process "pod_logs" {
    forward_to = [loki.write.loki.receiver]

    stage.static_labels {
      values = {
        cluster = "production",
        source  = "kubernetes",
      }
    }
  }

  // Read pod logs from Kubernetes
  loki.source.kubernetes "pods" {
    targets    = discovery.relabel.pod_logs.output
    forward_to = [loki.process.pod_logs.receiver]
  }

  // ===== OTLP RECEIVER CONFIGURATION =====
  otelcol.receiver.otlp "default" {
    grpc {
      endpoint = "0.0.0.0:4317"
    }
    http {
      endpoint = "0.0.0.0:4318"
    }
    
    output {
      metrics = [otelcol.processor.batch.default.input]
      logs    = [otelcol.processor.resource.default.input]
      traces  = [otelcol.processor.batch.default.input]
    }
  }

  // Add resource attributes processor for OTLP logs
  otelcol.processor.resource "default" {
    attributes {
      action = "insert"
      key    = "loki.format"
      value  = "json"
    }
    
    output {
      logs = [otelcol.processor.batch.default.input]
    }
  }

  // Batch processor for performance
  otelcol.processor.batch "default" {
    send_batch_size = 1024
    timeout         = "10s"
    
    output {
      metrics = [otelcol.exporter.prometheusremotewrite.mimir.input]
      logs    = [otelcol.exporter.loki.default.input]
      traces  = [otelcol.exporter.logging.traces.input]
    }
  }

  // ===== EXPORTERS =====
  // Export logs to Loki (using native Loki exporter, not OTLP)
  otelcol.exporter.loki "default" {
    forward_to = [loki.write.loki.receiver]
  }

  // Export metrics to Mimir
  otelcol.exporter.prometheusremotewrite "mimir" {
    endpoint = "http://mimir-distributor.observability.svc.cluster.local:9009/api/v1/push"
    
    resource_to_telemetry_conversion {
      enabled = true
    }
  }

  // Export traces to stdout
  otelcol.exporter.logging "traces" {
    verbosity           = "detailed"
    sampling_initial    = 5
    sampling_thereafter = 200
  }

  // ===== LOKI WRITER =====
  loki.write "loki" {
    endpoint {
      url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
    }
    
    external_labels = {
      cluster = "production",
    }
  }

# Environment variables available in the alloy Pod.
# We map secret values into env here; these are referenced in the alloyConfig using ${VAR}
env:
  - name: LOKI_TOKEN
    valueFrom:
      secretKeyRef:
        name: alloy-remote-credentials
        key: LOKI_TOKEN
  - name: MIMIR_TOKEN
    valueFrom:
      secretKeyRef:
        name: alloy-remote-credentials
        key: MIMIR_TOKEN

# Service exposure
service:
  type: ClusterIP
  port: 4317   # OTLP gRPC
  port_http: 4318 # OTLP HTTP

# Optionally enable Prometheus scraping on alloy itself
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false

# RBAC (if you want to grant Alloy read access to the kube API for Kubernetes discovery)
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "endpoints"]
      verbs: ["get","list","watch"]

# Pod security / tolerations and nodeSelector - tweak for your cluster policies
nodeSelector: {}
tolerations: []
affinity: {}

# Extra volumes (e.g. mount TLS certs) - example shows mounting a secret with CA if you need TLS to Loki/Mimir
extraVolumeMounts: []
extraVolumes: []

# Logging level (debug / info / warn / error)
logLevel: info
