# Clean Alloy Configuration - Minimal and Working
alloy:
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "container_logs" {
        targets = discovery.kubernetes.pods.targets
        
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          action        = "keep"
          regex         = "Running"
        }
        
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "drop"
          regex         = "^$"
        }
        
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/${1}_${2}_${3}/${4}/*.log"
        }
      }

      loki.source.file "container_logs" {
        targets    = discovery.relabel.container_logs.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
        external_labels = {
          cluster = "production",
        }
      }

  clustering:
    enabled: false
  
  mounts:
    varlog: true

controller:
  type: daemonset
  
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

serviceAccount:
  create: true
  name: alloy

rbac:
  create: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi